services:
  redis:
    image: redis:8
    container_name: my-redis
    env_file:
      - ./server/.env
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
